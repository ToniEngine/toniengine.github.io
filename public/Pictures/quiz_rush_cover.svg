<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="GET 323 Quiz Rush">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#46126e"/>
      <stop offset="60%" stop-color="#2b0a4d"/>
      <stop offset="100%" stop-color="#1b0533"/>
