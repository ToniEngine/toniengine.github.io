<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="GRIP - Gas Reliability and Integration Programme">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101725"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#g)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="120" cy="70" r="220" fill="#4d8dff" opacity=".13"/>

  <g fill="none" stroke="#4d8dff" stroke-width="1.5" opacity=".75">
    <path d="M-20 330 H210 L280 260 H520 L590 190 H820"/>
    <path d="M-20 150 H160 L230 220 H470 L560 320 H820" opacity=".45"/>
  </g>
  <g fill="#4d8dff">
    <circle cx="210" cy="330" r="5"/>
    <circle cx="520" cy="260" r="5"/>
    <circle cx="230" cy="220" r="4" opacity=".6"/>
    <circle cx="470" cy="220" r="4" opacity=".6"/>
  </g>

  <text x="60" y="185" font-family="Inter, Segoe UI, sans-serif" font-size="104" font-weight="800" letter-spacing="-5" fill="#ffffff">GRIP</text>
  <text x="64" y="222" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,.66)">Gas Reliability &amp; Integration Programme</text>

  <g transform="translate(64 258)">
    <rect width="196" height="30" rx="15" fill="rgba(255,214,107,.12)" stroke="rgba(255,214,107,.4)"/>
    <text x="98" y="20" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffd66b">1st Place - NEITC 2026</text>
  </g>

  <text x="64" y="400" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="2" fill="rgba(255,255,255,.35)">MGPUs / PIMS / GIP-CONNECT / UTILISATION</text>
</svg>
